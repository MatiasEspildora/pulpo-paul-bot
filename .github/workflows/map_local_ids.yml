name: Map Local Historic IDs

on:
  workflow_dispatch: # Se ejecuta manualmente desde la pestaña Actions

jobs:
  map-ids:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 🔑 Necesario para permitir el git push

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar mapeo inteligente de IDs
        run: python mapear_ids_locales.py

      - name: ⚙️ Configurar Git
        run: |
          git config --global user.name "Pulpo Paul Bot"
          git config --global user.email "bot@users.noreply.github.com"

      - name: 💾 Registrar y subir cambios históricos
        run: |
          git add historico_mensual/football/
          git status
          if git diff --staged --quiet; then
            echo "No se inyectaron nuevos IDs en esta pasada."
          else
            git commit -m "🧠 Auto-completado de IDs en archivos históricos [skip ci]"
            git push
          fi
