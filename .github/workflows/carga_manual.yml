name: Manual backfill process resultados/football JSONs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    name: Run backfill (manual)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Debug - listar resultados/football
        run: |
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "PWD: $(pwd)"
          echo "Files in repo root:"
          ls -la
          echo "Files in resultados/football:"
          ls -la resultados/football || true
          echo "Git tracked files matching pattern:"
          git ls-files 'resultados/football/partidos_*.json' || true

      - name: Add repo root to PYTHONPATH
        run: echo "PYTHONPATH=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pandas pytz numpy scipy

      - name: Run backfill (process all JSONs)
        run: |
          python test/carga_manual_fut.py --all

      - name: Commit historico_mensual/ and logs/ a rama paralela
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 🌿 Definimos la rama paralela de destino para aislar los cambios
          TARGET_BRANCH="historicos-actualizados"
          
          # Cambiar o crear la rama paralela localmente
          git checkout -b "$TARGET_BRANCH" || git checkout "$TARGET_BRANCH"

          # Add only if the directories exist
          [ -d historico_mensual/football ] && git add historico_mensual/football
          [ -d logs/football ] && git add logs/football

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci(backfill): update historico_mensual and logs via manual workflow"
            # 🚀 Subir exclusivamente a la rama paralela sin tocar main
            git push origin HEAD:"$TARGET_BRANCH"
          fi
