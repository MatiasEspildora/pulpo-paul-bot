name: Pulpo Paul Daily Bot

on:
  schedule:
    # Corre todos los días a las 23:00 hrs de Chile (03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite correrlo manualmente desde GitHub cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy requests

      - name: Run prediction script
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python bot.py
