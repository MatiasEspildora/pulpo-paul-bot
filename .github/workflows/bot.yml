name: Pulpo Paul Diario

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  analizar_partidos:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Necesario para el git push final

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el Pulpo Paul
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python main.py

      - name: Guardar resultados en GitHub
        run: |
          git config --global user.name "Pulpo Paul Bot"
          git config --global user.email "acciones@github.com"
          git add resultados/
          # Intentamos hacer commit; si no hay archivos nuevos, el script no falla
          git commit -m "🐙 Pulpo Paul: Guardando JSON y logs de hoy" || echo "No hay cambios para guardar"
          git push
