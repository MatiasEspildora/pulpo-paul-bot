name: Pulpo Paul Diario

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  analizar_partidos:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # ¡IMPORTANTE! Esto le da permiso al bot para guardar archivos en tu repo

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install pandas numpy requests scipy

      - name: Ejecutar el Pulpo Paul
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python bot.py

      # EL PASO NUEVO QUE GUARDA EL ARCHIVO
      - name: Guardar resultados en GitHub
        run: |
          git config --global user.name "Pulpo Paul Bot"
          git config --global user.email "acciones@github.com"
          git add resultados/
          git commit -m "🐙 Pulpo Paul: Guardando JSON de partidos" || echo "No hay cambios"
          git push
