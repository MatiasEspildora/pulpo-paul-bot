name: Align Historic CSV Files

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub

jobs:
  align-historics:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 🔑 Necesario para permitir el git push

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy pytz

      - name: 🚀 Ejecutar alineador de históricos
        run: python alinear_historicos.py

      - name: ⚙️ Configurar Git
        run: |
          git config --global user.name "Pulpo Paul Bot"
          git config --global user.email "bot@users.noreply.github.com"

      - name: 💾 Registrar y subir cambios históricos
        run: |
          git add historico_mensual/football/
          git status
          if git diff --staged --quiet; then
            echo "No hay cambios en los archivos históricos."
          else
            git commit -m "🤖 Normalización automática de archivos históricos [skip ci]"
            git push
          fi
